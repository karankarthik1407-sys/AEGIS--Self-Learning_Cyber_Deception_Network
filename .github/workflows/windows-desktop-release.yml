name: Build AEGIS Windows Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: aegis-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-desktop:
    name: Windows package and smoke test
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Verify tag matches product version
        shell: powershell
        run: |
          $Version = py -3 -c "from aegis.version import PRODUCT_VERSION; print(PRODUCT_VERSION)"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$Version") {
            throw "Tag ${{ github.ref_name }} does not match AEGIS v$Version"
          }
      - name: Verify repository contracts
        shell: powershell
        run: |
          py -3 tools/ci/check_repository_hygiene.py
          py -3 tools/ci/check_version_contract.py
          py -3 tools/ci/check_ui_contract.py
      - name: Build and verify AEGIS executables
        shell: powershell
        run: .\packaging\windows\Build-AEGIS-Desktop.ps1
      - name: Upload Windows release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AEGIS-Desktop-v1.2.0-win64
          path: |
            release/AEGIS-Desktop-v1.2.0-win64.zip
            release/AEGIS-Desktop-v1.2.0-win64.sha256
          if-no-files-found: error
          retention-days: 30
